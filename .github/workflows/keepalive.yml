# 保活: 公开仓库 60 天无活动会自动禁用定时工作流, 每周重新 enable 一次 (不产生提交)
name: Keepalive

on:
  schedule:
    - cron: '0 20 * * 1' # 每周一 UTC 20:00
  workflow_dispatch:

permissions:
  actions: write

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 重新启用定时工作流
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for wf in maintenance.yml keepalive.yml; do
            gh api -X PUT "repos/$REPO/actions/workflows/$wf/enable" && echo "已启用 $wf"
          done

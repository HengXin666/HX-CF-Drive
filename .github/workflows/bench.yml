# 线上轻量实测 (约 250 次请求, 上传约 90MB 到 TG), 每类操作占一个整分钟, 再从 CF GraphQL 取 CPU 和 D1 行数
# 令牌需要额外的 "账户 / 账户分析 / 读取" 权限才能取到 CPU
name: Bench

on:
  workflow_dispatch:

jobs:
  bench:
    if: vars.PUBLIC_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: 压测
        env:
          BASE: ${{ vars.PUBLIC_URL }}
          ADMIN: ${{ secrets.ADMIN_TOKEN }}
        run: node scripts/bench.mjs > bench-client.json
      - name: 等 CF 统计入库
        run: sleep 180
      - name: 取 CF 统计
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_NAME: ${{ vars.D1_NAME || 'hx-cf-drive' }}
        run: |
          npm ci --ignore-scripts
          export D1_ID=$(npx wrangler d1 list --json | jq -r --arg n "$D1_NAME" '.[] | select(.name==$n) | .uuid')
          node scripts/cfstats.mjs bench-client.json > bench.json
          cat bench.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench.json

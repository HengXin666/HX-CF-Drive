# 线上实测的统计部分: 先在自己机器跑 scripts/bench.mjs 得到各阶段的整分钟,
# 再把 phases 传进来, 这里用 CF 令牌从 GraphQL 取每分钟的 CPU / 子请求 / D1 行数
# 令牌需要额外的 "账户 / 账户分析 / 读取" 权限才能取到 Workers CPU
name: Bench

on:
  workflow_dispatch:
    inputs:
      client:
        description: 'bench.mjs 输出的 JSON (base64)'
        required: true

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: 取 CF 统计
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_NAME: ${{ vars.D1_NAME || 'hx-cf-drive' }}
          CLIENT: ${{ inputs.client }}
        run: |
          echo "$CLIENT" | base64 -d > bench-client.json
          npm ci --ignore-scripts
          export D1_ID=$(npx wrangler d1 list --json | jq -r --arg n "$D1_NAME" '.[] | select(.name==$n) | .uuid')
          node scripts/cfstats.mjs bench-client.json > bench.json
          cat bench.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench.json

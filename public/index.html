<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HX-CF-Drive</title>
<style>
  :root { --bg: #0f1115; --card: #171a21; --line: #262b36; --fg: #e6e8ee; --dim: #8a93a6; --acc: #4f8cff; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
  header { display: flex; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  header b { margin-right: auto; }
  input, button { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  button { cursor: pointer; } button:hover { border-color: var(--acc); }
  main { padding: 16px; max-width: 1100px; margin: 0 auto; }
  #crumbs a { color: var(--acc); cursor: pointer; text-decoration: none; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  td, th { padding: 8px; border-bottom: 1px solid var(--line); text-align: left; }
  th { color: var(--dim); font-weight: 500; }
  tr.dir td.name { cursor: pointer; color: var(--acc); }
  td.ops button { padding: 2px 8px; margin-right: 4px; }
  #drop { margin-top: 12px; padding: 18px; border: 1px dashed var(--line); border-radius: 8px; color: var(--dim); text-align: center; }
  #drop.over { border-color: var(--acc); color: var(--fg); }
  #log { margin-top: 12px; color: var(--dim); white-space: pre-wrap; font-size: 12px; }
</style>
</head>
<body>
<header>
  <b>HX-CF-Drive</b>
  <input id="token" type="password" placeholder="API 令牌" size="28">
  <button id="save">保存</button>
</header>
<main>
  <div id="crumbs"></div>
  <div style="margin-top: 10px; display: flex; gap: 8px;">
    <button id="mkdir">新建文件夹</button>
    <button id="pick">上传文件</button>
    <input id="file" type="file" multiple hidden>
    <input id="q" placeholder="搜索文件名">
    <button id="search">搜索</button>
  </div>
  <div id="drop">拖拽文件到这里上传</div>
  <table><thead><tr><th>名称</th><th>大小</th><th>修改时间</th><th>操作</th></tr></thead><tbody id="list"></tbody></table>
  <div id="log"></div>
</main>
<script>
// 极简前端: 浏览, 上传 (分片 + 断点重试), 下载, 分享, 删除。
const $ = (s) => document.querySelector(s);
let token = localStorage.getItem('hxd_token') || '';
let cwd = '/';
$('#token').value = token;

const log = (m) => { $('#log').textContent = `${new Date().toLocaleTimeString()} ${m}\n` + $('#log').textContent.slice(0, 4000); };
const fmt = (n) => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : n < 1073741824 ? (n / 1048576).toFixed(1) + ' MB' : (n / 1073741824).toFixed(2) + ' GB';
const esc = (s) => s.replace(/[&<>"]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));

async function api(method, path, body) {
  const r = await fetch('/api/v1' + path, {
    method, headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body): undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.status);
  return data;
}

async function load(path = cwd) {
  cwd = path;
  const parts = path.split('/').filter(Boolean);
  let acc = '';
  $('#crumbs').innerHTML = '<a data-p="/">根目录</a>' + parts.map((p) => { acc += '/' + p; return ` / <a data-p="${esc(acc)}">${esc(p)}</a>`; }).join('');
  try {
    const d = await api('GET', '/fs/list?path=' + encodeURIComponent(path));
    render(d.children);
  } catch (e) { log('加载失败: ' + e.message); }
}

function render(items, withPath) {
  $('#list').innerHTML = items.map((n) => `
    <tr class="${n.kind}" data-id="${n.id}" data-name="${esc(n.name)}" data-path="${esc(n.path || '')}">
      <td class="name">${n.kind === 'dir' ? '📁 ' : ''}${esc(withPath ? n.path : n.name)}</td>
      <td>${n.kind === 'dir' ? '-' : fmt(n.size)}</td>
      <td>${new Date(n.updatedAt).toLocaleString()}</td>
      <td class="ops">${n.kind === 'file' ? '<button data-a="link">直链</button><button data-a="dl">下载</button><button data-a="share">分享</button>' : ''}<button data-a="ren">重命名</button><button data-a="del">删除</button></td>
    </tr>`).join('') || '<tr><td colspan="4" style="color: var(--dim)">空</td></tr>';
}

$('#crumbs').onclick = (e) => { if (e.target.dataset.p) load(e.target.dataset.p); };
$('#save').onclick = () => { token = $('#token').value.trim(); localStorage.setItem('hxd_token', token); load('/'); };
$('#mkdir').onclick = async () => {
  const name = prompt('文件夹名称');
  if (name) { await api('POST', '/fs/mkdir', { path: cwd.replace(/\/$/, '') + '/' + name }); load(); }
};
$('#search').onclick = async () => {
  const q = $('#q').value.trim();
  if (!q) return load();
  render((await api('GET', '/fs/search?q=' + encodeURIComponent(q))).items, true);
};

$('#list').onclick = async (e) => {
  const tr = e.target.closest('tr');
  if (!tr) return;
  const id = tr.dataset.id, name = tr.dataset.name, a = e.target.dataset.a;
  try {
    if (!a && tr.classList.contains('dir')) return load(tr.dataset.path || cwd.replace(/\/$/, '') + '/' + name);
    if (a === 'link') { const { url } = await api('POST', '/fs/link', { id }); await navigator.clipboard.writeText(url).catch(() => {}); log('直链已复制: ' + url); }
    if (a === 'dl') { const { url } = await api('POST', '/fs/link', { id, expiresIn: 3600 }); location.href = url + '&download=1'; }
    if (a === 'share') { const pw = prompt('分享密码 (可留空)') || undefined; const s = await api('POST', '/shares', { id, password: pw }); log('分享链接: ' + s.url); }
    if (a === 'ren') { const nn = prompt('新名称', name); if (nn && nn !== name) { await api('POST', '/fs/move', { id, name: nn }); load(); } }
    if (a === 'del' && confirm(`删除 ${name}? 可在 7 天内恢复。`)) { await api('POST', '/fs/delete', { id }); load(); }
  } catch (err) { log('操作失败: ' + err.message); }
};

// 分片上传: 429 按 Retry-After 等待后重试, 其他错误重试 3 次
async function upload(file) {
  const init = await api('POST', '/uploads', { path: cwd, name: file.name, size: file.size, mime: file.type || undefined });
  if (init.done) return log(`秒传完成: ${file.name}`);
  for (let i = 0; i < init.chunkCount; i++) {
    const blob = file.slice(i * init.chunkSize, (i + 1) * init.chunkSize);
    for (let tries = 0; ; tries++) {
      const r = await fetch(`/api/v1/uploads/${init.uploadId}/${i}`, { method: 'PUT', headers: { Authorization: 'Bearer ' + token }, body: blob });
      if (r.ok) break;
      if (r.status === 429 || tries < 3) { await new Promise((s) => setTimeout(s, Number(r.headers.get('Retry-After') || 3) * 1000)); continue; }
      throw new Error(`分片 ${i} 失败: ${r.status}`);
    }
    log(`${file.name}: ${i + 1}/${init.chunkCount} (${init.driver})`);
  }
  await api('POST', `/uploads/${init.uploadId}/complete`);
  log(`上传完成: ${file.name}`);
}

async function uploadAll(files) {
  for (const f of files) { try { await upload(f); } catch (e) { log(`上传失败 ${f.name}: ${e.message}`); } }
  load();
}
$('#pick').onclick = () => $('#file').click();
$('#file').onchange = (e) => uploadAll([...e.target.files]);
const drop = $('#drop');
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); uploadAll([...e.dataTransfer.files]); };

if (token) load('/');
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="668" viewBox="0 0 960 668" role="img" aria-label="HX-CF-Drive 上传流程">
<title>HX-CF-Drive 上传流程</title>
<style>text{font-family:-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif;} .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace;}</style>
<defs><marker id="aadbac7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#adbac7"/></marker><marker id="af38020" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f38020"/></marker><marker id="a2aabee" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2aabee"/></marker><marker id="a7c8cff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c8cff"/></marker><marker id="a57ab5a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57ab5a"/></marker><marker id="a768390" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#768390"/></marker>
<linearGradient id="gOr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f38020"/><stop offset="1" stop-color="#f6a04d"/></linearGradient>
<linearGradient id="gBl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2aabee"/><stop offset="1" stop-color="#7c8cff"/></linearGradient>
</defs>
<rect width="960" height="668" rx="16" fill="#22272e"/>
<text x="32" y="44" font-size="20" fill="#e6edf3" text-anchor="start" font-weight="600">上传流程</text>
<text x="32" y="68" font-size="13" fill="#adbac7" text-anchor="start">三步无状态上传: 分片阶段 D1 零读写, 进度由客户端保存的签名回执表示, 断开后可从任意片继续。</text>
<rect x="20" y="150" width="920" height="176" rx="12" fill="#57ab5a" fill-opacity="0.06"/>
<rect x="20" y="150" width="4" height="176" rx="2" fill="#57ab5a"/>
<text x="34" y="170" font-size="12" fill="#57ab5a" text-anchor="start" font-weight="600">1  init</text>
<rect x="20" y="338" width="920" height="146" rx="12" fill="#f38020" fill-opacity="0.06"/>
<rect x="20" y="338" width="4" height="146" rx="2" fill="#f38020"/>
<text x="34" y="358" font-size="12" fill="#f38020" text-anchor="start" font-weight="600">2  chunk x N</text>
<rect x="20" y="496" width="920" height="158" rx="12" fill="#7c8cff" fill-opacity="0.06"/>
<rect x="20" y="496" width="4" height="158" rx="2" fill="#7c8cff"/>
<text x="34" y="516" font-size="12" fill="#7c8cff" text-anchor="start" font-weight="600">3  commit</text>
<line x1="130" y1="118" x2="130" y2="658" stroke="#768390" stroke-dasharray="4 5" stroke-opacity="0.7"/>
<line x1="400" y1="118" x2="400" y2="658" stroke="#768390" stroke-dasharray="4 5" stroke-opacity="0.7"/>
<line x1="640" y1="118" x2="640" y2="658" stroke="#768390" stroke-dasharray="4 5" stroke-opacity="0.7"/>
<line x1="850" y1="118" x2="850" y2="658" stroke="#768390" stroke-dasharray="4 5" stroke-opacity="0.7"/>
<rect x="60" y="84" width="140" height="40" rx="10" fill="#2d333b" stroke="#57ab5a" stroke-width="1.3"/>
<text x="130" y="103" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="600">客户端</text>
<text x="130" y="118" font-size="10.5" fill="#768390" text-anchor="middle">浏览器 / hxd</text>
<rect x="330" y="84" width="140" height="40" rx="10" fill="#2d333b" stroke="#f38020" stroke-width="1.3"/>
<text x="400" y="103" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="600">Worker</text>
<text x="400" y="118" font-size="10.5" fill="#768390" text-anchor="middle">Hono</text>
<rect x="570" y="84" width="140" height="40" rx="10" fill="#2d333b" stroke="#7c8cff" stroke-width="1.3"/>
<text x="640" y="103" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="600">D1</text>
<text x="640" y="118" font-size="10.5" fill="#768390" text-anchor="middle">目录树</text>
<rect x="780" y="84" width="140" height="40" rx="10" fill="#2d333b" stroke="#2aabee" stroke-width="1.3"/>
<text x="850" y="103" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="600">Telegram</text>
<text x="850" y="118" font-size="10.5" fill="#768390" text-anchor="middle">私有频道</text>
<rect x="70" y="168" width="120" height="26" rx="7" fill="#373e47" stroke="#57ab5a" stroke-width="1"/>
<text x="130" y="186" font-size="12" fill="#e6edf3" text-anchor="middle">本地算 sha256</text>
<path d="M130,224 L397,224" fill="none" stroke="#e6edf3" stroke-width="1.6" marker-end="url(#ae6edf3)"/><rect x="159.2" y="202.5" width="211.6" height="19.5" rx="5" fill="#252f31"/><text x="265.0" y="216" font-size="11.5" fill="#e6edf3" text-anchor="middle" class="m">POST /uploads {size, sha256}</text>
<path d="M400,246 L637,246" fill="none" stroke="#7c8cff" stroke-width="1.6" marker-end="url(#a7c8cff)"/><rect x="438.6" y="224" width="162.7" height="20" rx="5" fill="#252f31"/><text x="520.0" y="238" font-size="12" fill="#7c8cff" text-anchor="middle">按 sha256 查重, 解析父目录</text>
<path d="M640,268 L403,268" fill="none" stroke="#7c8cff" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a7c8cff)"/>
<path d="M400,292 L133,292" fill="none" stroke="#57ab5a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a57ab5a)"/><rect x="185.8" y="270" width="158.4" height="20" rx="5" fill="#252f31"/><text x="265.0" y="284" font-size="12" fill="#57ab5a" text-anchor="middle">命中: 秒传完成, 无需传分片</text>
<path d="M400,316 L133,316" fill="none" stroke="#f38020" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#af38020)"/><rect x="193.0" y="294" width="144.0" height="20" rx="5" fill="#252f31"/><text x="265.0" y="308" font-size="12" fill="#f38020" text-anchor="middle">未命中: 返回签名 ticket</text>
<rect x="174.9" y="348.5" width="180.1" height="19.5" rx="5" fill="#2f2c2d"/><text x="265" y="362" font-size="11.5" fill="#768390" text-anchor="middle">每片 19 MiB, 可并发, 可断点续传</text>
<path d="M130,396 L397,396" fill="none" stroke="#e6edf3" stroke-width="1.6" marker-end="url(#ae6edf3)"/><rect x="194.8" y="374.5" width="140.3" height="19.5" rx="5" fill="#2f2c2d"/><text x="265.0" y="388" font-size="11.5" fill="#e6edf3" text-anchor="middle" class="m">PUT /uploads/chunk</text>
<path d="M400,416 L847,416" fill="none" stroke="#2aabee" stroke-width="1.6" marker-end="url(#a2aabee)"/><rect x="531.4" y="394" width="187.2" height="20" rx="5" fill="#2f2c2d"/><text x="625.0" y="408" font-size="12" fill="#2aabee" text-anchor="middle">sendDocument, 请求体流式直通</text>
<path d="M850,448 L403,448" fill="none" stroke="#2aabee" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a2aabee)"/><rect x="551.3" y="426.5" width="147.5" height="19.5" rx="5" fill="#2f2c2d"/><text x="625.0" y="440" font-size="11.5" fill="#2aabee" text-anchor="middle" class="m">message_id, file_id</text>
<path d="M400,472 L133,472" fill="none" stroke="#f38020" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#af38020)"/><rect x="204.0" y="450" width="121.9" height="20" rx="5" fill="#2f2c2d"/><text x="265.0" y="464" font-size="12" fill="#f38020" text-anchor="middle">签名回执, D1 零读写</text>
<path d="M130,534 L397,534" fill="none" stroke="#e6edf3" stroke-width="1.6" marker-end="url(#ae6edf3)"/><rect x="187.7" y="512.5" width="154.6" height="19.5" rx="5" fill="#272d3b"/><text x="265.0" y="526" font-size="11.5" fill="#e6edf3" text-anchor="middle" class="m">POST /uploads/commit</text><rect x="211.5" y="540.5" width="107.0" height="19.5" rx="5" fill="#272d3b"/><text x="265.0" y="554" font-size="11.5" fill="#adbac7" text-anchor="middle">ticket + 全部回执</text>
<rect x="330" y="560" width="140" height="24" rx="7" fill="#373e47" stroke="#f38020" stroke-width="1"/>
<text x="400" y="577" font-size="12" fill="#e6edf3" text-anchor="middle">校验回执签名</text>
<path d="M400,616 L637,616" fill="none" stroke="#7c8cff" stroke-width="1.6" marker-end="url(#a7c8cff)"/><rect x="448.1" y="594" width="143.8" height="20" rx="5" fill="#272d3b"/><text x="520.0" y="608" font-size="12" fill="#7c8cff" text-anchor="middle">一次批量写: blob + node</text>
<path d="M400,640 L133,640" fill="none" stroke="#57ab5a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a57ab5a)"/><rect x="223.0" y="618" width="84.0" height="20" rx="5" fill="#272d3b"/><text x="265.0" y="632" font-size="12" fill="#57ab5a" text-anchor="middle">返回文件节点</text>
</svg>

<text x="52" y="315" font-size="12.5" fill="#adbac7" text-anchor="start">下载分片 1 次</text>
<rect x="160" y="304" width="12" height="12" rx="3" fill="#7c8cff"/>
<text x="180" y="315" font-size="12.5" fill="#adbac7" text-anchor="start">getFile 1 次 (file_path 未缓存)</text>
<text x="928" y="315" font-size="12" fill="#768390" text-anchor="end">示例: 8 个热分片 + 20 个冷分片 = 48 次</text>
<rect x="32" y="330" width="444" height="40" rx="10" fill="#2d333b"/>
<rect x="32" y="330" width="4" height="40" rx="2" fill="#2aabee"/>
<text x="50" y="355" font-size="13.5" fill="#2aabee" text-anchor="start" font-weight="600">热分片</text>
<text x="108" y="355" font-size="13" fill="#adbac7" text-anchor="start">1 次子请求, 单次响应最多 48 片, 约 912 MiB</text>
<rect x="484" y="330" width="444" height="40" rx="10" fill="#2d333b"/>
<rect x="484" y="330" width="4" height="40" rx="2" fill="#7c8cff"/>
<text x="502" y="355" font-size="13.5" fill="#7c8cff" text-anchor="start" font-weight="600">冷分片</text>
<text x="560" y="355" font-size="13" fill="#adbac7" text-anchor="start">2 次子请求, 单次响应最多 24 片, 约 456 MiB</text>
<rect x="32" y="392" width="300" height="30" rx="8" fill="#f38020" fill-opacity="0.85"/>
<text x="182.0" y="412" font-size="12.5" fill="#22272e" text-anchor="middle" font-weight="600">响应 1: 206</text>
<rect x="336" y="392" width="300" height="30" rx="8" fill="#d9822b" fill-opacity="0.85"/>
<text x="486.0" y="412" font-size="12.5" fill="#22272e" text-anchor="middle" font-weight="600">Range 续拉: 206</text>
<rect x="640" y="392" width="288" height="30" rx="8" fill="#b8732f" fill-opacity="0.85"/>
<text x="784.0" y="412" font-size="12.5" fill="#22272e" text-anchor="middle" font-weight="600">Range 续拉: 206</text>
<path d="M318,430 Q332,446 346,430" fill="none" stroke="#adbac7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aadbac7)"/>
<path d="M622,430 Q636,446 650,430" fill="none" stroke="#adbac7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aadbac7)"/>
<text x="32" y="458" font-size="12" fill="#768390" text-anchor="start">网页端, 播放器, 下载器会自动续拉; file_path 在内存缓存 50 分钟 (TG 保证至少 1 小时); Paid 计划可调大预算。</text>
</svg>

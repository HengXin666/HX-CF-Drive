<svg xmlns="http://www.w3.org/2000/svg" width="960" height="474" viewBox="0 0 960 474" role="img" aria-label="HX-CF-Drive 下载流程">
<title>HX-CF-Drive 下载流程</title>
<style>text{font-family:-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif;} .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Noto Sans Mono CJK SC', monospace;}</style>
<defs><marker id="aadbac7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#adbac7"/></marker><marker id="af38020" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f38020"/></marker><marker id="a2aabee" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2aabee"/></marker><marker id="a7c8cff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c8cff"/></marker><marker id="a57ab5a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57ab5a"/></marker><marker id="a768390" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#768390"/></marker>
<linearGradient id="gOr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f38020"/><stop offset="1" stop-color="#f6a04d"/></linearGradient>
<linearGradient id="gBl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2aabee"/><stop offset="1" stop-color="#7c8cff"/></linearGradient>
</defs>
<rect width="960" height="474" rx="16" fill="#22272e"/>
<text x="32" y="44" font-size="20" fill="#e6edf3" text-anchor="start" font-weight="600">下载流程</text>
<text x="32" y="68" font-size="13" fill="#adbac7" text-anchor="start">每次响应在子请求预算内尽量多拼分片, 拼不完返回 206, 客户端按 Range 继续拉取剩余部分。</text>
<rect x="32" y="92" width="206" height="96" rx="12" fill="#2d333b" stroke="#444c56" stroke-width="1"/>
<circle cx="56" cy="118" r="13" fill="#f38020"/><text x="56" y="123" font-size="14" fill="#22272e" text-anchor="middle" font-weight="600">1</text>
<text x="78" y="124" font-size="15" fill="#f38020" text-anchor="start" class="m">GET /f/:id</text>
<text x="52" y="152" font-size="12.5" fill="#adbac7" text-anchor="start">签名直链, 分享, API</text>
<text x="52" y="174" font-size="12.5" fill="#adbac7" text-anchor="start">可带 Range 请求头</text>
<path d="M240,140 L260,140" fill="none" stroke="#768390" stroke-width="1.6" marker-end="url(#a768390)"/>
<rect x="262" y="92" width="206" height="96" rx="12" fill="#2d333b" stroke="#444c56" stroke-width="1"/>
<circle cx="286" cy="118" r="13" fill="#adbac7"/><text x="286" y="123" font-size="14" fill="#22272e" text-anchor="middle" font-weight="600">2</text>
<text x="308" y="124" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">定位分片</text>
<text x="282" y="152" font-size="12.5" fill="#adbac7" text-anchor="start">按字节偏移计算</text>
<text x="282" y="174" font-size="12.5" fill="#adbac7" text-anchor="start">起止分片与片内偏移</text>
<path d="M470,140 L490,140" fill="none" stroke="#768390" stroke-width="1.6" marker-end="url(#a768390)"/>
<rect x="492" y="92" width="206" height="96" rx="12" fill="#2d333b" stroke="#444c56" stroke-width="1"/>
<circle cx="516" cy="118" r="13" fill="#7c8cff"/><text x="516" y="123" font-size="14" fill="#22272e" text-anchor="middle" font-weight="600">3</text>
<text x="538" y="124" font-size="15" fill="#7c8cff" text-anchor="start" font-weight="600">读分片清单</text>
<text x="512" y="152" font-size="12.5" fill="#adbac7" text-anchor="start">内存命中: D1 零读</text>
<text x="512" y="174" font-size="12.5" fill="#adbac7" text-anchor="start">未命中: D1 读 1 行</text>
<path d="M700,140 L720,140" fill="none" stroke="#768390" stroke-width="1.6" marker-end="url(#a768390)"/>
<rect x="722" y="92" width="206" height="96" rx="12" fill="#2d333b" stroke="#444c56" stroke-width="1"/>
<circle cx="746" cy="118" r="13" fill="#2aabee"/><text x="746" y="123" font-size="14" fill="#22272e" text-anchor="middle" font-weight="600">4</text>
<text x="768" y="124" font-size="15" fill="#2aabee" text-anchor="start" font-weight="600">原生拼接输出</text>
<text x="742" y="152" font-size="12.5" fill="#adbac7" text-anchor="start">FixedLengthStream</text>
<text x="742" y="174" font-size="12.5" fill="#adbac7" text-anchor="start">Worker CPU 几乎不参与</text>
<text x="32" y="228" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600">子请求预算</text>
<text x="114" y="228" font-size="12.5" fill="#f38020" text-anchor="start" class="m">SUBREQ_BUDGET = 48</text>
<text x="928" y="228" font-size="12" fill="#768390" text-anchor="end">Free 计划单次调用上限 50, 留 2 个余量</text>
<rect x="32" y="240" width="896" height="52" rx="10" fill="#2d333b" stroke="#444c56" stroke-width="1"/>

<line x1="570" y1="124" x2="570" y2="490" stroke="#f38020" stroke-dasharray="4 4" stroke-width="1.2"/>
<text x="570" y="508" font-size="11.5" fill="#f38020" text-anchor="middle">Free 10ms</text>
<text x="40" y="538" font-size="12.5" fill="#adbac7" text-anchor="start">CPU 中位数都在 1 到 6 ms, 上传和 Range 的 p99 偶尔超过 10 ms (冷启动), 本次 0 错误。</text>
<text x="40" y="560" font-size="12.5" fill="#adbac7" text-anchor="start">完整下载 40MB 慢在测试机经代理的带宽, Worker 本身只用了 6.2 ms CPU。</text>

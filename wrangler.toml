name = "hx-cf-drive"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# 静态前端 (web/ 构建到 dist/web)。静态资源请求免费, 不计入 Workers 请求数
[assets]
directory = "./dist/web"
binding = "ASSETS"
# 先匹配静态文件, 不匹配 (/api /f /s /dav) 才进 Worker, 首页不耗 Workers 请求
run_worker_first = false

[[d1_databases]]
binding = "DB"
database_name = "hx-cf-drive"
database_id = "REPLACE_WITH_YOUR_D1_ID"
migrations_dir = "migrations"

# 每 6 小时: Bot 探活, 回收站清理, 删除孤儿分片, 清扫放弃上传的消息。
# TG 只允许 Bot 删除 48 小时内的消息, 间隔不能再拉长 (见 src/services/sweep.ts)
[triggers]
crons = ["0 */6 * * *"]

[vars]
# 分片大小 (字节)。TG getFile 上限 20MB, 默认 19MiB, 超过会被自动压到 19MiB
CHUNK_SIZE = "19922944"
# 单次响应可用的外部子请求数。免费计划上限 50, 留 2 个余量; Paid 计划默认 10,000, 可调到 2000 以上
# 冷分片花 2 次 (getFile + 下载), 热分片 1 次
SUBREQ_BUDGET = "48"
# 每个令牌每分钟最多模糊搜索几次 (搜索会扫全表)
SEARCH_PER_MIN = "6"
# 回收站保留天数
TRASH_DAYS = "7"
# 1 = 永久直链的小文件 (≤25MB) 写入边缘缓存。只在自定义域名上生效, workers.dev 上无效
EDGE_CACHE = "0"
# 1 = 每个响应第一片的 TG file_path 存进 Cache API, 冷 isolate 不必再 getFile (首字节更快, 少吃 Bot 限流)。
# Cache API 只在自定义域名上有效, 且每次 match/put 都算子请求, 所以只用于第一片; workers.dev 上建议设为 0
PATH_CACHE = "1"
# 1 = 维护时清扫没被任何文件引用的频道消息 (放弃的上传)。多个部署共用一个频道时必须设为 0
ORPHAN_SWEEP = "1"
# 对外地址, 生成直链/分享链接时使用 (经 Service Binding 调用时也能拿到公网可用的链接)。不设则用请求的 origin
# PUBLIC_URL = "https://drive.example.com"

# 机密信息用 `wrangler secret put` 设置, 不要写在这里:
#   ADMIN_TOKEN   管理员令牌
#   SIGNING_KEY   直链签名密钥
#   BOT_TOKENS    逗号分隔的 Bot Token (也可以在后台 /api/v1/admin/bots 添加)
